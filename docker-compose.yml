services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nadlan
      POSTGRES_PASSWORD: nadlan
      POSTGRES_DB: nadlanbot
    ports:
      - "5432:5432"
    volumes:
      - nadlan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadlan -d nadlanbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nadlan_pg:
